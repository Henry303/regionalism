<!DOCTYPE html>
<!--
  Active theme is set on the <html> element below.
  The active `regionism` theme is defined in src/themes.css.
-->
<html lang="en" data-theme="regionism">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.ico" />
    <title>Regionalism</title>
    <!--
      First-paint background, keyed to the data-theme attribute above.
      Without this the browser paints white until the CSS bundle arrives —
      a hard flash on the dark themes. Each value mirrors --color-background
      in src/styles.css (slate) / src/themes.css; keep them in sync when
      adding or editing themes.
    -->
    <style>
      html { background-color: #ffffff; color-scheme: light; }
      /* Keep this background in sync with --color-background in themes.css. */
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
